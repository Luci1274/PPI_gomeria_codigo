<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/registro_proveedor.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Registro Proveedor</title>
</head>

<body>
    <div class="titulo">
        <h1>Registro de Proveedor</h1>
    </div>
    <div class="contenedor">
        <div class="formulario">
            <p class="descripcion">
                Complete los datos del proveedor para registrarlo en el sistema.
            </p>
            <form action="">

                <div class="campo">
                    <label for="InputNombre">Nombre del proveedor/empresa</label>
                    <input type="text" id="InputNombre" name="InputNombre" required>
                </div>

                <div class="campo">
                    <label for="InputCuit">CUIT</label>
                    <input type="text" id="InputCuit" name="InputCuit" required pattern="\d{2}-\d{8}-\d{1}"
                        title="El CUIT debe tener el formato XX-XXXXXXXX-X">
                </div>

                <div class="campo">
                    <label for="InputTelefono">Telefono</label>
                    <input type="tel" id="InputTelefono" name="InputTelefono" pattern="\d{3}-\d{3}-\d{4}"
                        title="El teléfono debe tener el formato XXX-XXX-XXXX">
                </div>

                <div class="campo">
                    <label for="InputEmail">Email</label>
                    <input type="email" id="InputEmail" name="InputEmail" required>
                </div>

                <div class="campo">
                    <label for="InputCiudad">Ciudad</label>
                    <select name="InputCiudad" id="InputCiudad">
                        <option value="">Seleccione una ciudad</option>
                        <option value="Buenos Aires">Buenos Aires</option>
                        <option value="Córdoba">Córdoba</option>
                        <option value="Rosario">Rosario</option>
                        <option value="Funes">Funes</option>
                        <option value="Roldan">Roldan</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="InputDireccion">Dirección</label>
                    <input type="text" id="InputDireccion" name="InputDireccion" required>
                </div>

            </form>
        </div>
        <div class="lado_derecho">
            <div class="imagen">
                <img src="../static/image/icono_proveedor.png" alt="Proveedor" class="img_proveedor">
            </div>

            <button type="submit">
                <i class="fas fa-user-plus"></i>
                Registrar
            </button>
        </div>
    </div>
    </div>

</body>

</html>
