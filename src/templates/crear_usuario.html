<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/../css/iniciar_sesion.css">
    <title>Crear usuario</title>
</head>

<body>
    <div class="contenedor_iniciar_sesion">
        <div class="caja_imagen">
        </div>
        <div id="caja_iniciar_sesion">
            <div id="caja_titulo">
                <h1>¡Bienvenido!</h1>
            </div>
            <div id="caja_opciones">
                <div id="caja_opcion_iniciar_sesion">
                    <a href="iniciar_sesion.html" id="iniciar_sesion">Iniciar sesión</a>
                </div>
                <div id="caja_opcion_crear_usuario">
                    <a href="crear_usuario.html" id="crear_usuario"> Crear usuario</a>
                </div>
            </div>
            <form method="post" action="/registro">
                    <div class="ingresar_datos">
                        <div>
                            <ion-icon name="person-outline"></ion-icon>
                        </div>
                        <input type="text" name="txt_input_nombre" id="txt_input_nombre" placeholder="Nombre de usuario" required>
                    </div>
                    
                    <div class="ingresar_datos">
                        <div>
                            <ion-icon name="mail-outline"></ion-icon>
                        </div>
                        <input type="email" name="email_input" id="email_input" placeholder="Ingrese su email" required>
                    </div>

                    <div class="ingresar_datos">
                        <div>
                            <ion-icon name="lock-closed-outline"></ion-icon>
                        </div>
                        <input type="password" name="password_input" id="password_input" placeholder=" Contraseña " required>
                    </div>
                    
                    <div class="ingresar_datos">
                        <div>
                            <ion-icon name="lock-closed-outline"></ion-icon>
                        </div>
                        <input type="password" name="password_input" id="password_input" placeholder=" Confirme su contraseña " required>
                    </div>

                    {% if error %}
                        <P class="error"> Complete todos los campos</P>
                    {% endif %}
                    <div>
                        <button type="submit">Iniciar sesión</button>
                    </div>
            </form>
        </div>
    </div>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>

</html>
